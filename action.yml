name: ts-only
description: Fail the check when JavaScript files appear in a TypeScript-only repository.
author: Marc Llobet
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Folder or file to check. Files listed in .tsonlyignore are skipped.
    default: "."

outputs:
  count:
    description: Number of JavaScript files found.
  files:
    description: JSON array with their paths.

runs:
  using: node24
  main: src/action.ts
