name: ts-only

on:
  workflow_call:
    inputs:
      path:
        type: string
        default: "."
      extensions:
        type: string
        default: ""
      exclude:
        type: string
        default: ""
      fail:
        type: boolean
        default: true
      scope:
        type: string
        default: all
      commit-status:
        type: boolean
        default: false
      status-context:
        type: string
        default: ts-only
    outputs:
      count:
        value: ${{ jobs.ts-only.outputs.count }}
      files:
        value: ${{ jobs.ts-only.outputs.files }}
      scope:
        value: ${{ jobs.ts-only.outputs.scope }}

jobs:
  ts-only:
    name: ts-only
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.check.outputs.count }}
      files: ${{ steps.check.outputs.files }}
      scope: ${{ steps.check.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: check
        uses: MarcLlobet/ts-only@v1
        with:
          path: ${{ inputs.path }}
          extensions: ${{ inputs.extensions }}
          exclude: ${{ inputs.exclude }}
          fail: ${{ inputs.fail }}
          scope: ${{ inputs.scope }}
          commit-status: ${{ inputs.commit-status }}
          status-context: ${{ inputs.status-context }}
