name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog and tags
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Work out the next version
        id: plan
        run: node scripts/release.ts

      - name: Test before releasing
        if: steps.plan.outputs.release == 'true'
        run: |
          npm ci
          npm test

      - name: Commit, tag and create the GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          MAJOR: ${{ steps.plan.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "release: $TAG"
          git tag "$TAG"
          git tag -f "$MAJOR"
          git push origin HEAD:main "refs/tags/$TAG"
          git push -f origin "refs/tags/$MAJOR"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag

  npm:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TS_ONLY_PACKAGE_TOKEN }}
        run: npm publish --access public
