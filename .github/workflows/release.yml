name: Release

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: plan
        run: node scripts/release.ts

      - if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          MAJOR: ${{ steps.plan.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "release: $TAG"
          git tag "$TAG" && git tag -f "$MAJOR"
          git push origin HEAD:main "$TAG" && git push -f origin "$MAJOR"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          npm install -g npm@^11.5.1
          npm ci && npm run build && npm publish --access public
