name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci
      - run: npm run lint
      - run: npm run tscheck
      - run: npm test
      - run: npm run build && npm pack --dry-run 2>&1 | grep dist/cli.js
      - uses: ./
      - uses: ./
        with:
          scope: added
