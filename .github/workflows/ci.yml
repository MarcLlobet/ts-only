name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Regenerate lockfile (temporary)
        if: contains(github.event.head_commit.message, '[regen-lock]')
        run: |
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update package-lock.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - run: npm ci
      - run: npm run lint
      - run: npm run tscheck
      - run: npm test
      - run: npm run build && npm pack --dry-run 2>&1 | grep dist/cli.js
      - uses: ./
      - uses: ./
        with:
          scope: added
