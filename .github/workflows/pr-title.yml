name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  release-prefix:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ "$TITLE" =~ ^(patch|minor|major):\ .+ ]] || {
            echo '::error::Start the title with "patch: ", "minor: " or "major: ". It becomes the release note.'
            exit 1
          }
